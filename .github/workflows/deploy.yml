name: Deploy to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_IP }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ubuntu@${{ secrets.EC2_IP }} << 'EOF'
            set -e
            cd ~/football-analytics-engine

            echo "Pulling latest code..."
            git pull origin ${{ github.ref_name }}

            echo "Rebuilding containers..."
            docker compose build --no-cache frontend django fastapi

            echo "Restarting services..."
            docker compose up -d --no-deps frontend
            sleep 8
            docker compose up -d --no-deps django
            sleep 12
            docker compose up -d --no-deps fastapi
            sleep 8
            docker compose up -d --no-deps celery

            echo "Health check..."
            for i in {1..12}; do
              if curl -fsS http://localhost/health > /dev/null; then
                echo "Health check passed"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check failed after retries"
                docker compose ps
                docker compose logs --tail=200 nginx django fastapi celery
                exit 1
              fi
              sleep 5
            done

            echo "Deploy complete"
            docker compose ps
          EOF
