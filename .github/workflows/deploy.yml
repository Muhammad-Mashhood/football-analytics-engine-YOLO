name: Deploy to EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.EC2_IP }}"
          test -n "${{ secrets.EC2_SSH_KEY }}"

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.EC2_IP }} << 'EOF'
            set -euo pipefail
            cd ~/football-analytics-engine

            echo "Pulling latest code..."
            git pull origin ${{ github.ref_name }}

            echo "Rebuilding containers..."
            docker compose build --no-cache frontend django fastapi

            echo "Restarting services..."
            docker compose up -d --no-deps django
            sleep 12
            docker compose up -d --no-deps fastapi
            sleep 8
            docker compose up -d --no-deps celery
            sleep 5
            docker compose up -d --no-deps frontend

            echo "Health checks..."
            for i in {1..24}; do
              if curl -fsS http://localhost/api/auth/health/ > /dev/null && curl -fsS http://localhost/api/ml/health > /dev/null; then
                echo "Auth + ML health checks passed"
                break
              fi
              if [ "$i" -eq 24 ]; then
                echo "Health check failed after retries"
                docker compose ps
                docker compose logs --tail=300 frontend django fastapi celery
                exit 1
              fi
              sleep 10
            done

            echo "Deploy complete"
            docker compose ps
          EOF
